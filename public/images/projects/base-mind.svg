<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">BaseMind — AI SaaS platform</title>
  <desc id="desc">BaseMind project cover</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1b22" />
      <stop offset="0.6" stop-color="#0f2b38" />
      <stop offset="1" stop-color="#123a4e" />
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.45" />
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)" />
  <rect width="1200" height="750" fill="url(#glow)" />
  <rect width="1200" height="750" fill="url(#grid)" />
  <text x="92" y="120" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="600" letter-spacing="6" fill="#2dd4bf" text-transform="uppercase">AI SaaS Platform</text>
  <text x="88" y="430" font-family="ui-sans-serif, system-ui, sans-serif" font-size="92" font-weight="800" fill="#ecfeff">BaseMind</text>
  <text x="94" y="492" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" fill="#9db9c9">AI agents, knowledge base, analytics</text>
  <text x="92" y="650" font-family="ui-sans-serif, system-ui, sans-serif" font-size="130" fill="#14b8a6">🧠</text>
</svg>